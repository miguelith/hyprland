# TLP config for ThinkPad T430 - battery optimization

# CPU governor: powersave on battery, performance on AC
CPU_SCALING_GOVERNOR_AC=performance
CPU_SCALING_GOVERNOR_BAT=powersave

# CPU energy performance: performance on AC, power on battery
CPU_ENERGY_PERF_POLICY_AC=performance
CPU_ENERGY_PERF_POLICY_BAT=power

# Disable turbo boost on battery for longer life
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform profile: performance on AC, low-power on battery
PLATFORM_PROFILE_AC=performance
PLATFORM_PROFILE_BAT=low-power

# WiFi power saving: 1=on
WIFI_PWR_ON_AC=0
WIFI_PWR_ON_BAT=1

# Disable wake on LAN
WOL_DISABLE=Y

# Sound power saving: 0=off, 1=on (15s), 2=auto
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# Runtime PM for PCI devices: auto=on
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Disk APM: 1-127=power saving, 128-254=performance, 255=off
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

# Disk spindown timeout: 0=off, 1-20=seconds*5
DISK_SPINDOWN_TIMEOUT_ON_AC="0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="12"

# AHCI link power management: 0=off, 1=med_power, 2=min_power
AHCI_RUNTIME_PM_ON_AC="on"
AHCI_RUNTIME_PM_ON_BAT="med_power_with_dma"

# PCIe autosuspend: 0=off, 1=on
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Set charge thresholds (T430 supports this)
# 80=start charge, 95=stop charge - extends battery lifespan
START_CHARGE_THRESH_BAT0=40
STOP_CHARGE_THRESH_BAT0=80

# Power off idle radios on battery
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth wwan"
