background {
    monitor =
    path = /home/miguelith/Pictures/Wallpapers/grey-abstract.jpg
    blur_passes = 0
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0
}

label {
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = d8dee9
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(0,0,0)
    shadow_boost = 2.0
}

label {
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = d8dee9
    font_size = 16
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 2.0
}

input-field {
    size = 200, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = 88c0d0
    inner_color = 252a30
    font_color = d8dee9
    fade_on_empty = false
    placeholder_text = locked
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(0,0,0)
    shadow_boost = 2.0
}
